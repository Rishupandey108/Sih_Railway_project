services:
  - type: web
    name: sih-railway-maintenance-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
